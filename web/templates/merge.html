<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge Config</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:14px Inter,Arial,sans-serif;padding:16px;max-width:720px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px}button{border:0;border-radius:7px;padding:8px;color:#fff;background:#25252d;font-weight:700;cursor:pointer}.accent{color:#ff2458;background:none}.label{font-size:10px;color:#aaa;margin:20px 8px 7px}.tabs,.box,.item{background:#0d0d22;border-radius:8px}.tabs{padding:3px;display:flex;gap:3px;overflow:auto}.tabs button.active{background:#555563}.box{padding:10px}.name{width:100%;background:#28282d;color:#fff;border:0;border-radius:6px;padding:12px;margin-top:10px}.head{display:flex;justify-content:space-between}.item{border:1px solid #45455d;margin-bottom:8px;padding:12px;display:flex;align-items:center;gap:9px}.info{flex:1;min-width:0;word-break:break-all}.info b{font-size:12px}.info small{color:#aaa}.number{background:#f22655;border-radius:4px;padding:4px 7px}.controls button{padding:5px;margin:2px}.empty{text-align:center;color:#aaa;padding:25px}.status{text-align:center;color:#4cd964;margin:8px}</style></head><body>
<header><h1>Merge Config</h1><button id="save" class="accent">Save</button></header><div id="status" class="status"></div><div class="label">ACTIVE GROUP <button id="delete" class="accent" style="float:right">Delete</button></div><div class="box"><div id="tabs" class="tabs"></div><input id="name" class="name"></div><div class="label head"><span>MERGE SEQUENCE (<span id="count">0</span>)</span><span id="size" class="accent">0 B</span></div><div id="assigned" class="box"></div><div class="label">AVAILABLE MEDIA (<span id="available-count">0</span>)</div><div id="available"></div>
<script>
const gid=new URLSearchParams(location.search).get('gid');let files=[],groups=[],active=0;
const bytes=n=>!n?'0 B':(n/1024/1024).toFixed(2).replace(/\.00$/,'')+' MB';
const group=()=>groups[active];const assigned=()=>new Set(groups.flatMap(g=>g.files));
function render(){let g=group(),tabsEl=document.getElementById('tabs'),nameEl=document.getElementById('name');tabsEl.innerHTML=groups.map((x,i)=>`<button class="${i==active?'active':''}" onclick="active=${i};render()">Grp ${i+1}</button>`).join('')+'<button class="accent" onclick="groups.push({name:`Merged_Video_${groups.length+1}.mp4`,files:[]});active=groups.length-1;render()">＋</button>';nameEl.value=g.name;document.getElementById('count').textContent=g.files.length;document.getElementById('size').textContent=bytes(g.files.reduce((n,p)=>n+files.find(f=>f.path==p).size,0));document.getElementById('assigned').innerHTML=g.files.length?g.files.map((p,i)=>card(p,i,true)).join(''):'<div class="empty">Empty group. Tap a file below to add.</div>';let free=files.filter(f=>!assigned().has(f.path));['available-count'].forEach(id=>document.getElementById(id).textContent=free.length);document.getElementById('available').innerHTML=free.length?free.map(f=>card(f.path,0,false)).join(''):'<div class="box empty">✓<br>All files assigned.</div>'}
function card(p,i,inGroup){let f=files.find(x=>x.path==p),a=p.split('/'),n=a.pop();return `<div class="item"><span class="number">${inGroup?i+1:'▶'}</span><div class="info"><b>${n}</b><br><small>${bytes(f.size)}${a.length?' • '+a.join('/')+'/':''}</small></div><div class="controls">${inGroup?`<button onclick="swap(${i},-1)" ${i?'':'disabled'}>⌃</button><button onclick="swap(${i},1)" ${i<group().files.length-1?'':'disabled'}>⌄</button><button class="accent" onclick="group().files.splice(${i},1);render()">−</button>`:`<button class="accent" onclick="group().files.push('${p.replaceAll("'","\\'")}');render()">＋</button>`}</div></div>`}
function swap(i,d){let a=group().files,j=i+d;[a[i],a[j]]=[a[j],a[i]];render()}document.getElementById('name').oninput=e=>group().name=e.target.value;document.getElementById('delete').onclick=()=>{if(groups.length==1)return alert('You must have at least one group.');groups.splice(active,1);active=0;render()};document.getElementById('save').onclick=async()=>{let r=await fetch('/app/merge/submit?gid='+encodeURIComponent(gid),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groups:groups.filter(g=>g.files.length)})}),d=await r.json();document.getElementById('status').textContent=d.success?'Config Saved. Return to Telegram.':d.error};
fetch('/app/merge/files?gid='+encodeURIComponent(gid)).then(r=>r.json()).then(d=>{if(d.error)throw Error(d.error);files=d.files;groups=[{name:'Merged_Video_1.mp4',files:[]}];render()}).catch(e=>document.getElementById('status').textContent=e.message);
</script></body></html>
